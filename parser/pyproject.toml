[project]
name = "wav-metadata-parser"
version = "0.1.0"
description = "Baseline WAV/RIFF metadata parser (core format + optional chunks: LIST/INFO, bext, cue, smpl, fact, ID3v2 header) -- raw extraction only, no scoring/normalization"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["wav_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
