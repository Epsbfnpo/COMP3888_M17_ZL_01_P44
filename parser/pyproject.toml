[project]
name = "comp3888-provenance-parsers"
version = "0.1.0"
description = "Baseline C2PA / DDEX-RIN / DDEX-ERN metadata parsers (raw extraction only, no scoring/normalization)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
c2pa = ["c2pa-python>=0.5"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["rin_parser", "ern_parser", "c2pa_parser"]

[tool.setuptools.packages.find]
include = ["common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
